[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soteria-pmo"
version = "1.0.0"
description = "Agentes PMO: os sete itens de gestao de projeto e horas sobre o ClickUp"
requires-python = ">=3.11"
# Uma dependencia de runtime, e ela e o cliente HTTP. Nada da pilha pesada do
# delegation-core (chromadb, fastmcp, sentence-transformers, tree-sitter)
# atravessa a fronteira: o interprete de modelo entra por Protocol, entao o
# pacote roda, e e testado, sem GPU e sem servidor de modelo.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soteria-pmo = "soteria_pmo.cli:main"
soteria-pmo-instalar = "soteria_pmo.instalador:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
