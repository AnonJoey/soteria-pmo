name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: suite (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      # F: nomes nao usados e redefinicoes (uma funcao e um teste mortos por
      # redefinicao foram achados assim em 08/10/2026); E9: erro de sintaxe.
      - name: Lint
        run: python -m ruff check --no-cache --select F,E9 src tests
      - name: Testes
        run: python -m pytest -q -p no:cacheprovider
